<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>LightHouse in 3D Matrix → Map</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui;
    }

    #hint {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      color: white;
      background: rgba(0,0,0,0.45);
      padding: 10px 12px;
      border-radius: 12px;
      font: 13px system-ui;
      line-height: 1.35;
      user-select: none;
      max-width: 520px;
    }

    /* Map overlay */
    #mapOverlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.65);
    }
    #mapOverlay.hidden { display: none; }

    #mapPanel {
      background: rgba(20,20,20,0.95);
      padding: 16px;
      border-radius: 16px;
      width: min(860px, 92vw);
    }

    #mapTitle {
      color: white;
      margin-bottom: 12px;
      font: 600 16px system-ui;
    }

    #mapGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .mapTile {
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.15);
      position: relative;
      background: #111;
    }

    .mapTile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.95;
    }

    .mapTile span {
      position: absolute;
      left: 8px;
      bottom: 8px;
      color: white;
      font: 600 12px system-ui;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    #closeMap {
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
  </style>

  <script async src="https://unpkg.com/es-module-shims@1.8.2/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="hint">Loading…</div>

  <div id="mapOverlay" class="hidden">
    <div id="mapPanel">
      <div id="mapTitle">Choose a Panorama</div>
      <div id="mapGrid"></div>
      <button id="closeMap">Close</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { STLLoader } from "three/addons/loaders/STLLoader.js";

    // --------- Files (same as yours) ---------
    const STL_FILE = "lightHouse.stl";
    const panoFiles = ["pano1.jpeg","pano2.jpeg","pano3.jpeg","pano4.jpeg","pano5.jpeg","pano6.jpeg"];
    const panoLabels = ["Pano 1","Pano 2","Pano 3","Pano 4","Pano 5","Pano 6"];

    // --------- Scene ---------
    let scene, camera, renderer, controls;
    const texLoader = new THREE.TextureLoader();

    // Modes: "matrix" | "pano"
    // (Map overlay can be open/closed on top)
    let mode = "matrix";

    // STL
    let stlMesh = null;

    // Pano
    let panoIndex = 0;
    let panoTexture = null;

    function setHint(html) {
      document.getElementById("hint").innerHTML = html;
    }

    // ---------- Matrix (3D cube lattice) ----------
    function createCubeMatrix({ count = 7, spacing = 35, cubeSize = 6 } = {}) {
      const half = Math.floor(count / 2);

      const geo = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
      const mat = new THREE.MeshBasicMaterial({ color: 0x44ff88, wireframe: true });

      const group = new THREE.Group();

      for (let x = -half; x <= half; x++) {
        for (let y = -half; y <= half; y++) {
          for (let z = -half; z <= half; z++) {
            // leave the origin empty so STL sits there
            if (x === 0 && y === 0 && z === 0) continue;

            const cube = new THREE.Mesh(geo, mat);
            cube.position.set(x * spacing, y * spacing, z * spacing);
            group.add(cube);
          }
        }
      }

      scene.add(group);
    }

    async function loadSTL() {
      const loader = new STLLoader();
      const geom = await loader.loadAsync(STL_FILE);

      const mat = new THREE.MeshPhongMaterial({ color: 0xcccccc, shininess: 80 });
      stlMesh = new THREE.Mesh(geom, mat);

      // center STL at origin
      geom.computeBoundingBox();
      const box = geom.boundingBox;
      const center = new THREE.Vector3();
      box.getCenter(center);
      stlMesh.position.sub(center);

      // scale STL to look good inside matrix
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      stlMesh.scale.setScalar(60 / maxDim);

      scene.add(stlMesh);
    }

    // ---------- Pano ----------
    async function loadPanorama(i) {
      panoIndex = i;

      const tex = await texLoader.loadAsync(panoFiles[panoIndex]);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      panoTexture = tex;

      scene.background = tex;

      if (stlMesh) stlMesh.visible = false;

      setHint(
        `<b>Panorama Mode</b><br/>
         - Drag mouse to look around<br/>
         - Press <b>ESC</b> to return to matrix<br/>
         - Press <b>E</b> to open map<br/>
         <span style="opacity:.85">Current: ${panoLabels[panoIndex]}</span>`
      );
    }

    function enterMatrixMode() {
      mode = "matrix";

      scene.background = null;
      if (stlMesh) stlMesh.visible = true;

      camera.position.set(200, 180, 200);
      controls.target.set(0, 0, 0);
      controls.enableZoom = true;
      controls.enablePan = true;
      controls.update();

      setHint(
        `<b>Matrix Mode (STL Encapsulated)</b><br/>
         - Orbit: drag mouse<br/>
         - Zoom: scroll<br/>
         - Press <b>E</b> to open map (choose a panorama)`
      );
    }

    async function enterPanoMode(i) {
      mode = "pano";

      // For pano, bring camera closer and reduce zoom/pan
      camera.position.set(0, 0, 10);
      controls.target.set(0, 0, 0);
      controls.enableZoom = false;
      controls.enablePan = false;
      controls.update();

      await loadPanorama(i);
    }

    // ---------- Map UI ----------
    function openMap() {
      document.getElementById("mapOverlay").classList.remove("hidden");
    }

    function closeMap() {
      document.getElementById("mapOverlay").classList.add("hidden");
    }

    function buildMapGrid() {
      const grid = document.getElementById("mapGrid");
      grid.innerHTML = "";

      panoFiles.forEach((file, idx) => {
        const tile = document.createElement("div");
        tile.className = "mapTile";
        tile.innerHTML = `<img src="${file}" alt="pano ${idx+1}"><span>${panoLabels[idx]}</span>`;
        tile.onclick = async () => {
          closeMap();
          await enterPanoMode(idx);
        };
        grid.appendChild(tile);
      });
    }

    // ---------- Render loop ----------
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // ---------- Boot ----------
    window.onload = async () => {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 5000);
      camera.position.set(200, 180, 200);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Lights
      scene.add(new THREE.AmbientLight(0xffffff, 0.55));
      const dir = new THREE.DirectionalLight(0xffffff, 1.2);
      dir.position.set(300, 400, 300);
      scene.add(dir);

      // Optional axes helper
      scene.add(new THREE.AxesHelper(120));

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 0, 0);
      controls.update();

      // Load assets
      await loadSTL();
      createCubeMatrix({ count: 7, spacing: 35, cubeSize: 6 });
      buildMapGrid();

      // Map close actions
      document.getElementById("closeMap").onclick = closeMap;
      document.getElementById("mapOverlay").onclick = (ev) => {
        if (ev.target.id === "mapOverlay") closeMap();
      };

      // Keys
      window.addEventListener("keydown", async (e) => {
        if (e.code === "KeyE") {
          // From ANY mode, E opens the map
          openMap();
        }

        if (e.code === "Escape") {
          // If map is open, close it
          if (!document.getElementById("mapOverlay").classList.contains("hidden")) {
            closeMap();
            return;
          }

          // If in pano, ESC returns to matrix
          if (mode === "pano") {
            enterMatrixMode();
          }
        }
      });

      // Start in matrix mode
      enterMatrixMode();
      animate();
    };
  </script>
</body>
</html>
